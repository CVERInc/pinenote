<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- 按下去會變成灰階：一道連續的斜坡。
       階調不能用灰去畫 —— 這是兩色面板，半透明的灰會被量化成雜訊，而在黑白模
       式底下更是只剩抖動網點，圖示會在自己描述的那個模式裡糊掉。
       第一版是四根遞增的長條，結果讀起來就是訊號格，而面板上隔壁真的就是
       Wi-Fi。實心楔形沒有那個歧義，也跟旁邊的刷新鈕（外框螢幕）輪廓不撞。 -->
  <g fill="#2e3436">
    <path d="M1 14 L15 14 L15 2 Z"/>
  </g>
</svg>
