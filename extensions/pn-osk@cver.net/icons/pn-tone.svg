<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- 色調。外框逐段照抄 pn-screen-refresh：同一塊裸面板、同樣沒有底座。兩顆
       共用外框是要說「這兩顆都是對螢幕本身做事」，差別在框裡面。

       🔑 裡面是**真的灰**，而這一顆圖示只有一張：
       灰階模式下它是一道平滑的斜坡；黑白模式下驅動會把灰換算成網點，於是同一
       張圖自己變成一排由粗到細的點。所以按鈕不必畫兩個狀態 —— 狀態是硬體畫
       的，而且畫的就是這個模式對「灰」做了什麼。這是這台唯一一個可以讓儀器自
       己當儀表的地方。

       ⚠️ 檔名不能帶 -symbolic：那條路會整片重新上色，灰會被拉成全黑。
       ⚠️ 螢幕截圖裡它永遠是平滑的 —— 抖動發生在驅動裡，框緩衝看不到。這顆圖
       示只有玻璃驗得了。 -->
  <defs>
    <linearGradient id="r" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#eee"/>
    </linearGradient>
  </defs>
  <rect x="2.5" y="3.5" width="11" height="9" fill="url(#r)"/>
  <path fill="#2e3436" fill-rule="evenodd" d="M2.75 2h10.5A1.75 1.75 0 0 1 15 3.75v8.5A1.75 1.75 0 0 1 13.25 14H2.75A1.75 1.75 0 0 1 1 12.25v-8.5A1.75 1.75 0 0 1 2.75 2zm0 1.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25z"/>
</svg>
