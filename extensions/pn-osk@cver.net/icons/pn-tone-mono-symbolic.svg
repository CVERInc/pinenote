<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- 按下去會變成黑白：兩塊色票，一黑一白。畫的是「這個模式一共有幾個顏色」，
       而答案剛好是二 —— 中間那些階不是變淡了，是不存在（照片靠抖動網點去換算，
       不靠階調）。左黑右白照著「黑白」兩個字的順序。 -->
  <g fill="#2e3436">
    <rect x="0.5" y="4.75" width="6.5" height="6.5"/>
    <path fill-rule="evenodd" d="M9 4.75h6.5v6.5H9zm1 1v4.5h4.5V5.75z"/>
  </g>
</svg>
