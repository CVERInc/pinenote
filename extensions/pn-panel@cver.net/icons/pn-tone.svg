<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Tone. The frame is copied verbatim from pn-screen-refresh: same bare panel, same
       no bezel. Sharing the frame between the two icons says "both of these act on the
       screen itself" — the difference is inside the frame.

       🔑 What's inside is **actually gray**, and this icon is a single image: in
       grayscale mode it's a smooth gradient ramp; in black-and-white mode the driver
       dithers gray into a halftone, so the same image turns itself into a row of dots
       going from coarse to fine. So the button doesn't need to draw two states — the
       state is drawn by the hardware, and what it draws is exactly what this mode does
       to "gray". This is the one place on this device where the instrument gets to be
       its own gauge.

       ⚠️ The filename must not carry -symbolic: that path recolors the whole icon, and
       the gray gets pulled to solid black.
       ⚠️ In a screenshot it's always smooth — the dithering happens in the driver, and
       the framebuffer never sees it. Only glass can verify this icon. -->
  <defs>
    <linearGradient id="r" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#eee"/>
    </linearGradient>
  </defs>
  <rect x="2.5" y="3.5" width="11" height="9" fill="url(#r)"/>
  <path fill="#2e3436" fill-rule="evenodd" d="M2.75 2h10.5A1.75 1.75 0 0 1 15 3.75v8.5A1.75 1.75 0 0 1 13.25 14H2.75A1.75 1.75 0 0 1 1 12.25v-8.5A1.75 1.75 0 0 1 2.75 2zm0 1.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25z"/>
</svg>
