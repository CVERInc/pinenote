<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Global refresh: the panel gets flashed to solid black then solid white, so the
       icon depicts that moment itself — a screen split half black, half white. The
       conventional refresh icon uses two curved arrows; this one deliberately avoids
       any arrow vocabulary.
       No bezel: this device is a bare panel, and adding a bezel would read as
       "display settings". -->
  <g fill="#2e3436">
    <!-- Frame (outer rounded rect minus inner rounded rect) -->
    <path fill-rule="evenodd" d="M2.75 2h10.5A1.75 1.75 0 0 1 15 3.75v8.5A1.75 1.75 0 0 1 13.25 14H2.75A1.75 1.75 0 0 1 1 12.25v-8.5A1.75 1.75 0 0 1 2.75 2zm0 1.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25z"/>
    <!-- Left half filled: the half the refresh sweep passed over -->
    <path d="M2.5 3.75c0-.138.112-.25.25-.25H8v9H2.75a.25.25 0 0 1-.25-.25z"/>
  </g>
</svg>
