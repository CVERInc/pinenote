# Why this exists, in one boot's worth of detail:
#
# gpio-keys (the magnetic cover switch) sometimes loses a boot-time race with its
# GPIO controller and fails to probe:
#
#     gpio-keys gpio-keys: error -ENXIO: Unable to get irq number for GPIO 0
#
# A device that never probed never gains power/wakeup — and this service reads
# exactly that file while checking travel mode, so it panics at startup (exit 101).
# Losing it takes org.pinenote.ebc off the bus, which means TriggerGlobalRefresh
# has no listener, which means nothing ever clears e-ink ghosting again. Three days
# of unreadable screen, from one lost race at t+1.3s.
#
# Rebinding the driver after boot has always worked — by then the controller is up.
#
# The guard tests for the `driver` symlink, not for power/wakeup. Both are absent
# after a failed probe, but power/wakeup once created never goes away again, so it
# cannot tell "bound" from "was bound once". The symlink is the honest question,
# and it also covers the cover switch itself being unbound, which matters on its own.
[Service]
ExecStartPre=-/bin/sh -c 'test -e /sys/devices/platform/gpio-keys/driver || echo gpio-keys > /sys/bus/platform/drivers/gpio-keys/bind'
Restart=on-failure
RestartSec=5
