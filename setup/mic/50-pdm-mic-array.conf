# The four holes above the screen are a PDM microphone array, and nothing in the
# audio stack knows it exists. This card ships no UCM profile, so WirePlumber
# falls back to a generic stereo configuration that describes only device 0 --
# the rk817 codec. Device 1, fe440000.pdm-dmic, is enumerated by ALSA as hw:0,1
# and never reaches PipeWire, so every application sees one stereo source and
# the array might as well not be there.
#
# Measured before writing this: hw:0,1 accepts 2-6 channels, all four carry
# signal at about -54 dBFS in a quiet room, and pairwise correlation runs 0.33
# to 0.47 -- high enough that they hear one acoustic scene, low enough that the
# differences between them are real spatial information rather than a copy.
#
# The first ~0.3s after opening is a PDM settling transient that pins three
# channels to full scale. PipeWire holds the device open, so it happens once.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = api.alsa.pcm.source
      node.name        = "alsa_input.pdm-mic-array"
      node.description = "Microphone Array (4ch)"
      media.class      = "Audio/Source"
      api.alsa.path    = "hw:0,1"
      audio.channels   = 4
      audio.rate       = 48000
      audio.format     = "S16LE"
      audio.position   = [ FL FR RL RR ]
      api.alsa.headroom = 1024
    }
  }
]
