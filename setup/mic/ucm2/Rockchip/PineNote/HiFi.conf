# HiFi verb for the PineNote (Pine64) sound card.
#
# Hardware, from `arecord -l` and `arecord --dump-hw-params`:
#   hw:PineNote,0  fe410000.i2s-rk817-hifi   rk817 codec: 2ch playback + capture (its own mic input)
#   hw:PineNote,1  fe440000.pdm-dmic-hifi    PDM microphone array: 2-6ch capture, 4 channels wired and live
#
# Mixer controls, from `amixer -c0 contents` (unchanged from the near-identical
# Rockchip/rk817-sound profile this file borrows its Speaker/Mic sections from):
#   'Master Playback Volume', 'Master Capture Volume', 'Mic Capture Gain',
#   'Playback Mux' (HP/SPK), 'Internal Speakers Switch'
# The PDM device has no mixer controls of its own -- gain/routing for it is
# fixed in hardware, so its SectionDevice below sets no *MixerElem.

Define.pbk_mux "SPK"

If.1 {
	Condition {
		Type ControlExists
		Control "name='Internal Speakers Switch'"
	}

	True {
		Define.pbk_mux "HP"
		SectionDevice."Speaker".EnableSequence [
			cset "name='Internal Speakers Switch' on"
		]

		SectionDevice."Speaker".DisableSequence [
			cset "name='Internal Speakers Switch' off"
		]
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker (rk817 codec playback, hw:PineNote,0)"

	EnableSequence [
		cset "name='Playback Mux' ${var:pbk_mux}"
	]

	Value {
		PlaybackMixerElem "Master Playback Volume"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Built-in microphone (rk817 codec capture input, hw:PineNote,0)"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureMixerElem "Mic Capture Gain"
		CaptureMasterElem "Master Capture Volume"
	}
}

SectionDevice."Mic Array" {
	Comment "4-channel PDM microphone array above the screen (hw:PineNote,1)"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 4
	}
}
